extends:
  - spectral:oas

rules:
  # Custom rule: All error responses (4xx, 5xx, and default) must use ProblemDetails with $ref
  error-responses-use-problem-details:
    description: All error responses (4xx, 5xx, and default) should return ProblemDetails using $ref
    message: "Error response must reference the ProblemDetails schema using $ref"
    severity: warn
    given: "$.paths.*[get,post,put,patch,delete,options,head,trace].responses[?(@property.match(/^([45][0-9][0-9]|default)$/))].content['application/json'].schema"
    then:
      field: $ref
      function: truthy


