name: Build and Validate OpenAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/UsersApi/UsersApi.csproj

      - name: Build project (generates OpenAPI document)
        run: dotnet build src/UsersApi/UsersApi.csproj --no-restore

      - name: Verify OpenAPI document was generated
        run: |
          if [ -f "openapi.json" ]; then
            echo "✅ OpenAPI document generated successfully"
            cat openapi.json
          else
            echo "❌ OpenAPI document not found!"
            exit 1
          fi

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-document
          path: openapi.json

  spectral:
    runs-on: ubuntu-latest
    name: Validate API specification against styleguide
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenAPI document
        uses: actions/download-artifact@v4
        with:
          name: openapi-document

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@sander1095"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint OpenAPI document with Spectral
        run: npx spectral lint openapi.json --fail-severity=warn

  breaking-changes:
    runs-on: ubuntu-latest
    name: Check for Breaking API Changes
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenAPI document
        uses: actions/download-artifact@v4
        with:
          name: openapi-document

      - name: Check for breaking API changes
        uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.base_ref }}/openapi.json
          revision: openapi.json
