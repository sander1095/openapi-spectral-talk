name: OpenAPI Spectral Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/OpenApiSpectralDemo/OpenApiSpectralDemo.csproj
      
    - name: Build and generate OpenAPI document
      run: dotnet build src/OpenApiSpectralDemo/OpenApiSpectralDemo.csproj --no-restore --configuration Release
      
    - name: Upload OpenAPI document
      uses: actions/upload-artifact@v4
      with:
        name: openapi-document
        path: openapi/OpenApiSpectralDemo.json
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Spectral
      run: npm ci
      
    - name: Run Spectral validation
      run: npm run lint:openapi
      
    - name: Spectral validation summary
      if: always()
      run: |
        echo "## Spectral Validation Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "OpenAPI document has been validated using Spectral with:" >> $GITHUB_STEP_SUMMARY
        echo "- Base Spectral OAS rules" >> $GITHUB_STEP_SUMMARY
        echo "- Custom rule to validate ProblemDetails on error responses" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See job logs for detailed results." >> $GITHUB_STEP_SUMMARY
